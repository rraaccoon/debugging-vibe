name: 별 수 갱신

on:
  schedule:
    - cron: "30 23 * * *" # 매일 08:30 (한국 시간) = 23:30 UTC
  workflow_dispatch: # 깃허브 화면에서 손으로도 돌릴 수 있다

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 라이브러리를 안 쓰므로 npm ci 가 필요 없다
      - run: node scripts/update-stars.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 바뀌었으면 main 에 커밋 (Vercel 이 이 커밋을 보고 자동 배포한다)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/vibe/tips.ts
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않음"
          else
            git commit -m "정보 공유 별 수 자동 갱신"
            git push
          fi
